<title>PM Foundations Prep</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A tap-and-sort walkthrough of the Product Management Foundations syllabus, made to prep for the course.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;700&display=swap">
<style>
/* Layout: one idea per screen. Flat blocks of color carry structure; no borders, no pills, type does the rest. */
:root{
  --bg:#FAFAFD; --surface:#FFFFFF; --soft:#EEEEF6; --fg:#1B1A26; --muted:#66657A;
  --ink:#1B1A26; --paper:#FFFFFF;
  --yellow:#FFC533; --coral:#FF6A55; --blue:#2F6BFF; --green:#1FCB8A; --purple:#7C4DF2; --pink:#FF6FB1; --teal:#19C3D6;
  --good:#12A56B; --bad:#E5484D;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Avenir Next","Segoe UI",system-ui,sans-serif;
  --r:16px; --rs:12px;
  --c:var(--blue); --on:var(--paper);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121118; --surface:#1F1E29; --soft:#2A2937; --fg:#F4F3FB; --muted:#A3A2B8; --good:#3DD39A; --bad:#FF7A7E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121118; --surface:#1F1E29; --soft:#2A2937; --fg:#F4F3FB; --muted:#A3A2B8; --good:#3DD39A; --bad:#FF7A7E; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:500 17px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
#app{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.02;margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:clamp(2.3rem,7vw,4.4rem)}
h2{font-size:clamp(1.7rem,4.6vw,2.7rem)}
h3{font-size:1.25rem;line-height:1.1}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{border:0;cursor:pointer;background:none;padding:0;text-align:left}
:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.muted{color:var(--muted)}

/* home */
.top{display:flex;flex-direction:column;gap:10px;padding-block:18px 6px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tile{position:relative;overflow:hidden;background:var(--c);color:var(--on);border-radius:var(--r);padding:20px;min-height:190px;
  display:flex;flex-direction:column;justify-content:flex-end;gap:4px;transition:transform .15s}
.tile:hover{transform:translateY(-4px) rotate(-.6deg)}
.tile .num{position:absolute;top:8px;left:18px;font:800 4.2rem/1 var(--display);opacity:.95}
.tile .shape{position:absolute;right:-28px;top:-28px;width:130px;height:130px;background:var(--on);opacity:.13}
.tile:nth-child(1) .shape{border-radius:50%}
.tile:nth-child(2) .shape{clip-path:polygon(50% 0,100% 100%,0 100%);right:-10px;top:-10px}
.tile:nth-child(3) .shape{border-radius:0 0 0 100%}
.tile:nth-child(4) .shape{transform:rotate(45deg)}
.tile:nth-child(5) .shape{clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);right:-6px;top:-6px}
.tile:nth-child(6) .shape{border-radius:50% 50% 0 0}
.tile:nth-child(7) .shape{border-radius:50%;width:220px;height:220px}
.tile h3{font-size:1.9rem}
.tile small{font-size:.86rem;line-height:1.25;opacity:.85}
.bar{height:8px;border-radius:3px;background:color-mix(in srgb,var(--on) 22%,transparent);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--on);border-radius:3px}
.tile.wide{grid-column:1/-1;min-height:140px}
.foot{font-size:.85rem;color:var(--muted)}
.path{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px 10px;font:700 1rem/1.2 var(--display)}
.path li{display:flex;align-items:center;gap:8px}
.path li i{width:14px;height:14px;border-radius:3px;flex:none}
.path li:not(:last-child)::after{content:"→";margin-left:6px;color:var(--muted);font-weight:500}

/* player */
.nav{display:flex;gap:12px;align-items:center}
.sq{width:44px;height:44px;flex:none;border-radius:var(--rs);background:var(--soft);display:grid;place-items:center;font-size:1.2rem;font-weight:700}
.segs{display:flex;gap:5px;flex:1;min-width:0}
.segs button{flex:1;height:14px;border-radius:4px;background:var(--soft)}
.segs button.seen{background:color-mix(in srgb,var(--c) 45%,var(--soft))}
.segs button.on{background:var(--c)}
.stage{background:color-mix(in srgb,var(--c) 13%,var(--bg));border-radius:24px;padding:clamp(20px,5vw,48px);min-height:min(62vh,560px);
  display:flex;flex-direction:column;gap:22px;justify-content:center;animation:in .28s ease-out}
.stage.full{background:var(--c);color:var(--on)}
.stage.full h2{font-size:clamp(2rem,5.6vw,3.5rem);max-width:18ch}
.stage.full .lead{font-size:1.2rem;max-width:48ch;opacity:.92}
.lead{font-size:1.1rem;max-width:52ch}
.cover{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:10px 26px;font:700 1.05rem/1.2 var(--display)}
.cover li{display:flex;align-items:center;gap:9px}
.cover li::before{content:"";width:10px;height:10px;border-radius:2px;background:currentColor;opacity:.5}
.make{opacity:.85}
@keyframes in{from{opacity:.4;transform:translateY(10px)}to{opacity:1;transform:none}}
.ctrl{display:flex;gap:12px}
.btn{background:var(--soft);border-radius:var(--rs);padding:14px 22px;font-weight:700;text-align:center}
.btn.go{background:var(--c);color:var(--on);flex:1;font-size:1.1rem}
.btn:hover{filter:brightness(1.06)}

/* palette cycle for blocks */
.k0{background:var(--yellow);color:var(--ink)} .k1{background:var(--blue);color:var(--paper)}
.k2{background:var(--pink);color:var(--ink)} .k3{background:var(--green);color:var(--ink)}
.k4{background:var(--purple);color:var(--paper)} .k5{background:var(--coral);color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.blk{border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.blk p{font-size:.98rem;line-height:1.35}
.blk em{font-style:normal;font-size:.9rem;opacity:.8}

/* reveal tiles */
.flip{min-height:104px;justify-content:center;transition:transform .15s}
.flip:hover{transform:scale(1.02)}
.flip p{display:none}
.flip.open p{display:block}
.flip{position:relative;padding-right:54px}
.flip::after{content:"+";position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:8px;background:color-mix(in srgb,currentColor 18%,transparent);display:grid;place-items:center;font:800 1.25rem/1 var(--display)}
.flip.open::after{content:"–"}
.stage{position:relative}
.cue{position:absolute;z-index:5;pointer-events:none;display:flex;gap:8px;align-items:center;background:var(--fg);color:var(--bg);font-weight:700;font-size:.95rem;padding:8px 13px;border-radius:10px;
  box-shadow:0 6px 18px color-mix(in srgb,var(--fg) 25%,transparent);transform:translateY(-100%) rotate(-2deg);animation:cueIn .25s ease-out both;white-space:nowrap;max-width:calc(100% - 24px)}
.cue span{display:inline-block;animation:bob 1.1s ease-in-out infinite}
@keyframes cueIn{from{opacity:0;margin-top:6px}to{opacity:1;margin-top:0}}
@keyframes bob{50%{transform:translateY(4px)}}

/* steps */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:26px 30px}
.steps .blk{position:relative}
.steps .blk:not(:last-child)::after{content:"→";position:absolute;right:-24px;top:50%;transform:translateY(-50%);color:var(--fg);font-weight:700;font-size:1.2rem}
@media(max-width:640px){.steps{grid-template-columns:1fr}.steps .blk:not(:last-child)::after{content:"↓";right:50%;top:auto;bottom:-25px;transform:translateX(50%)}}

/* versus */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vs>div{border-radius:var(--rs);padding:14px 16px;min-width:0}
.vs .hd{font:800 1.3rem/1.1 var(--display)}
.vs .l{background:var(--surface)} .vs .r{background:var(--c);color:var(--on)}

/* sorter */
.item{background:var(--surface);border-radius:var(--r);padding:26px 20px;font:800 clamp(1.25rem,3.6vw,1.8rem)/1.15 var(--display);text-align:center;min-height:110px;display:grid;place-items:center;gap:12px}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.buckets.g2{grid-template-columns:1fr 1fr}
.bucket{border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;font:800 1.2rem/1.1 var(--display);transition:transform .12s}
.bucket span{font:500 .85rem/1.2 var(--body);opacity:.85}
.bucket:hover{transform:translateY(-3px)}
.bucket.no{animation:shake .3s}
.bucket.yes{animation:pop .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pop{50%{transform:scale(1.08)}}
.bucket.hint{outline:4px solid var(--fg);outline-offset:3px}
.teach{background:var(--surface);border-radius:var(--r);padding:16px 18px;display:grid;gap:4px;font-size:1.05rem;animation:in .25s ease-out}
.teach b{font:800 1.2rem/1.1 var(--display);color:var(--bad)}
.teach span{color:var(--muted);font-size:.92rem}
.count{font:500 .9rem var(--body);color:var(--muted)}

/* quiz */
.opts{display:grid;gap:10px}
.opt{background:var(--surface);border-radius:var(--rs);padding:16px 18px;font-weight:700}
.opt:hover{background:var(--soft)}
.opt.right{background:var(--good);color:var(--paper)}
.opt.wrong{background:var(--bad);color:var(--paper);animation:shake .3s}

/* persona */
.persona{display:grid;grid-template-columns:auto 1fr;gap:18px;background:var(--surface);border-radius:var(--r);padding:20px;align-items:center}
.face{width:96px;height:96px;border-radius:50%;background:var(--c);position:relative}
.face::before,.face::after{content:"";position:absolute;background:var(--on)}
.face::before{width:10px;height:10px;border-radius:50%;left:30px;top:36px;box-shadow:26px 0 0 var(--on)}
.face::after{width:34px;height:17px;border-radius:0 0 34px 34px;left:31px;top:56px}
.facts{display:grid;gap:8px}
.facts b{font-family:var(--display)}

/* journey + funnel */
.chart{background:var(--surface);border-radius:var(--r);padding:12px;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:480px;height:auto}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.pick button{background:var(--surface);border-radius:var(--rs);padding:12px;font-weight:700;text-align:center}
.pick button.on{background:var(--c);color:var(--on)}
.frow{display:grid;grid-template-columns:120px 1fr 64px;gap:12px;align-items:center;width:100%;padding:8px 10px;border-radius:var(--rs)}
.frow.on{background:var(--surface)}
.frow b{font-family:var(--display)}
.frow .track{height:26px}
.frow .track i{display:block;height:100%;border-radius:4px;min-width:6px}
.frow .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
@media(max-width:520px){.frow{grid-template-columns:96px 1fr 56px}}
.out{background:var(--c);color:var(--on);border-radius:var(--r);padding:20px;display:grid;gap:6px}
.rowlabel{font-weight:700}
.group{display:grid;gap:8px}

/* builder */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.form label{display:grid;gap:5px;font-weight:700;font-size:.92rem}
.form input,.form select{background:var(--surface);border:0;border-radius:var(--rs);padding:13px 14px;width:100%;font-weight:500}
.preview{background:var(--c);color:var(--on);border-radius:var(--r);padding:22px;font:600 clamp(1.1rem,2.8vw,1.45rem)/1.35 var(--display)}
.preview i{font-style:normal;opacity:.55}
.preview u{text-decoration-thickness:3px;text-underline-offset:4px}
.qs{display:grid;gap:12px}
.qs .blk{font:600 1.2rem/1.25 var(--display)}

/* pitch */
.slide{background:var(--c);color:var(--on);border-radius:var(--r);padding:22px;display:grid;gap:10px}
.slide .txt{font:600 1.15rem/1.35 var(--display)}
.slide .txt i{font-style:normal;opacity:.55}
.slide a{color:inherit;font-weight:700}
.copyout{width:100%;min-height:160px;background:var(--surface);color:var(--fg);border:0;border-radius:var(--rs);padding:14px;font:500 .95rem/1.4 var(--body)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
/* intro */
.intro{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:clamp(24px,5vw,56px);align-items:center;padding-block:clamp(24px,8vh,80px)}
.intro .msg{display:flex;flex-direction:column;gap:22px;min-width:0}
.intro .msg p{font:600 clamp(1.3rem,3.2vw,1.85rem)/1.35 var(--display);letter-spacing:-.01em;max-width:30ch;text-wrap:pretty}
.intro .msg a.inl{color:inherit;text-decoration-color:var(--coral);text-decoration-thickness:4px;text-underline-offset:5px}
.intro .msg p.fyi{font:500 .95rem/1.4 var(--body);color:var(--muted);letter-spacing:0;max-width:none}
.intro .acts{display:flex;flex-wrap:wrap;gap:12px}
.intro .acts a{text-decoration:none}
.intro .btn.go{flex:none;padding:16px 26px}
.shapes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.shapes i{aspect-ratio:1;display:block;background:var(--c)}
.shapes i:nth-child(1){--c:var(--yellow);border-radius:50%}
.shapes i:nth-child(2){--c:var(--coral);clip-path:polygon(50% 0,100% 100%,0 100%)}
.shapes i:nth-child(3){--c:var(--blue);border-radius:0 0 0 100%}
.shapes i:nth-child(4){--c:var(--green);border-radius:50% 50% 0 0}
.shapes i:nth-child(5){--c:var(--purple);transform:scale(.7) rotate(45deg)}
.shapes i:nth-child(6){--c:var(--pink);border-radius:50% 0 50% 0}
.shapes i{animation:pop .5s ease-out both}
.shapes i:nth-child(2){animation-delay:.06s}.shapes i:nth-child(3){animation-delay:.12s}.shapes i:nth-child(4){animation-delay:.18s}.shapes i:nth-child(5){animation-delay:.24s}.shapes i:nth-child(6){animation-delay:.3s}
@media(max-width:640px){.intro{grid-template-columns:1fr}.shapes{grid-template-columns:repeat(6,1fr);order:-1;max-width:360px}}
@media(max-width:720px){.tiles{grid-template-columns:1fr 1fr}.tile{min-height:170px}}
@media(max-width:420px){.tiles{grid-template-columns:1fr}.persona{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<main id="app"></main>

<script>
/* Course link. Swap in a personal referral link here if you get one. */
const REF_URL='https://productschool.com/courses/product-management-certification?utm_source=playhz&utm_medium=referral&utm_campaign=pm-foundations-prep';

const C={yellow:['var(--yellow)','var(--ink)'],coral:['var(--coral)','var(--ink)'],blue:['var(--blue)','var(--paper)'],green:['var(--green)','var(--ink)'],purple:['var(--purple)','var(--paper)'],pink:['var(--pink)','var(--ink)'],teal:['var(--teal)','var(--ink)']};

const M=[
{id:'m1',name:'Think',official:'Develop Strategic Product Thinking',col:'yellow',artifact:'Problem Hook',cards:[
 {t:'big',h:'What did it change?',p:'That’s the question a PM keeps asking. Shipping a feature is output. People behaving differently because of it, in a way that also helps the business, is the outcome you get judged on.',on:['Outputs vs outcomes','Weighing ideas','B2C vs B2B','Framing a problem']},
 {t:'sort',h:'Output or outcome?',buckets:['Output','Outcome'],hints:['We made a thing','Something changed'],items:[
  ['Launched dark mode',0,'A launch is something you made. Nothing has changed for the user yet.'],
  ['Checkout time dropped 30%',1,'Users feel this change. That makes it an outcome.'],
  ['Released version 2 of the app',0,'A release is a delivery. Ask what it changed.'],
  ['Weekly active users up 12%',1,'Behavior changed. That is the result you ship for.'],
  ['Closed 14 tickets this sprint',0,'Tickets show how busy the team was, not what improved.'],
  ['Support requests cut in half',1,'Fewer people get stuck. Something real changed.']]},
 {t:'cols',h:'Three questions for every idea',p:'An idea that only scores well on one of these usually isn’t worth doing yet.',cols:[
  ['User value','Does it fix a real pain?','Parents waste 2 hours a week planning meals.'],
  ['Business value','Does it move a number we care about?','Planners who finish a plan stay 3× longer.'],
  ['Effort','What does it cost to build?','Two weeks, one squad.']]},
 {t:'vs',h:'Selling to people vs selling to companies',a:'B2C',b:'B2B',rows:[
  ['The user buys','A boss or buyer signs'],['Decides in seconds','Decides in months'],['Habit and emotion','ROI and risk'],['Grows by word of mouth','Grows through sales']]},
 {t:'sort',h:'B2C or B2B?',buckets:['B2C','B2B'],items:[
  ['Duolingo',0,'One person downloads it and uses it. Buyer and user are the same.'],
  ['Workday',1,'HR software bought by a company. The employees using it didn’t choose it.'],
  ['Six-month sales cycle',1,'Long cycles mean many approvers. That is a company buying.'],
  ['Downloaded on the couch in 30 seconds',0,'One person, one fast decision. Consumer behavior.'],
  ['Procurement needs a security review',1,'Only companies have procurement and security reviews.'],
  ['Growth through TikTok',0,'Viral reach works on people. Companies rarely buy from a feed.']]},
 {t:'steps',h:'A problem hook in four parts',steps:[
  ['Who','Busy parents'],['Pain','can’t plan a week of dinners'],['Cause','because recipes and shopping live in different places'],['Value at stake','so they overspend on takeaway']]},
 {t:'quiz',q:[
  ['Which one is an outcome?',['We shipped onboarding v2','New users finish setup twice as fast','The team closed 30 tickets'],1,'Shipping and closing tickets are outputs. Faster setup is a change for the user.'],
  ['What usually makes B2B different?',['The buyer is often not the user','Users never pay','There are no competitors'],0,'In B2B the person who signs is often not the person who uses it.'],
  ['Users love it, it takes a year, and it moves no business number.',['Build it now','Park it','Double the team'],1,'It wins on user value only. No business value and a huge effort means it waits.']]},
 {t:'ask',q:['How do you push back when a stakeholder asks for a feature instead of an outcome?','Which of the three pillars gets overruled most often in your company, and by whom?']},
 {t:'build'}]},

{id:'m2',name:'Discover',official:'Discover Product Opportunities via Qualitative Signals',col:'coral',artifact:'Persona & Journey Map',cards:[
 {t:'big',h:'People already get by without you.',p:'Before your product exists, people manage with a spreadsheet, a group chat or a habit. Switching costs them effort. So you need to understand that workaround well, and be clearly better than it.',on:['Workarounds as clues','Personas','Journey maps','The experience gap']},
 {t:'reveal',h:'Workarounds are clues',p:'Each one is someone patching a gap. Tap to see which gap.',tiles:[
  ['Screenshots of receipts','Logging an expense takes too long.'],
  ['A spreadsheet with nine tabs','The tool doesn’t fit how the team plans.'],
  ['Texting yourself reminders','Capturing a task takes too many taps.'],
  ['Asking the same colleague every time','Nobody can find the answer on their own.']]},
 {t:'persona',h:'Design for one person you can picture'},
 {t:'journey',h:'Follow Maya through her week',p:'Each dot is a step. Higher means happier. The low point is usually where a product can help most.'},
 {t:'journey',gap:1,h:'The experience gap',p:'The space between what Maya expects and what she actually gets. Where that space is widest is usually the best place to start.'},
 {t:'vs',h:'What people do beats what they say',a:'Weak signal',b:'Strong signal',rows:[
  ['“I would use that”','“Last week I did this”'],['Feature wish lists','Hacks and workarounds'],['Polite compliments','Sighs, swearing, giving up']]},
 {t:'quiz',q:[
  ['Who is usually your top competitor?',['The market leader','The status quo','A new startup'],1,'Most people don’t switch to a rival. They keep doing what they already do.'],
  ['A customer keeps a nine-tab spreadsheet next to your tool. That is…',['A training issue','A signal of an unmet need','Nothing to worry about'],1,'A workaround is effort someone spends because the product falls short.'],
  ['Where is the opportunity on a journey map?',['The first step','Where expectation and reality are furthest apart','The final step'],1,'The position of the step doesn’t matter. The widest gap between hope and reality does.']]},
 {t:'ask',q:['What interview question gets you the most honest answers?','When did a workaround lead you to a product you actually shipped?']},
 {t:'build'}]},

{id:'m3',name:'Measure',official:'Use Analytics and Metrics for Data-Driven Decisions',col:'blue',artifact:'Testable Hypothesis',cards:[
 {t:'big',h:'Which numbers actually matter?',p:'Dashboards fill up with totals that only ever go up. The useful numbers are rates tied to user value. When one of those moves, you know where to look and what to try next.',on:['Vanity vs strategic metrics','The AARRR funnel','From data to hypothesis']},
 {t:'sort',h:'Vanity or strategic?',buckets:['Vanity','Strategic'],hints:['Only goes up','Changes a decision'],items:[
  ['Total downloads, all time',0,'It can only go up, so it never tells you to change course.'],
  ['Share of new users who finish setup',1,'A rate. If it drops, you know exactly where to look.'],
  ['Page views',0,'Volume without context. More views doesn’t mean more value.'],
  ['Week-4 retention',1,'It shows whether people keep getting value. You can act on it.'],
  ['Followers',0,'Feels good, changes no decision.'],
  ['Revenue per active user',1,'It ties usage to the business. You can act on it.']]},
 {t:'funnel',h:'The AARRR funnel',p:'Five stages from first visit to paying customer. Look for the biggest drop between two stages. That’s where to dig.'},
 {t:'steps',h:'From a number to something you can test',steps:[
  ['Data','4 in 5 sign-ups never make a first plan'],['Insight','Setup asks 12 questions before any value'],['Hypothesis','A 3-question setup lifts activation'],['Test','Run it and decide']]},
 {t:'reveal',h:'What makes a hypothesis testable',tiles:[
  ['Change','What we will do differently.'],
  ['Success metric','The number that should move, and by how much.'],

   if(q===1)return['Prototype test','Five people and a clickable mock find most usability problems. Traffic doesn’t matter.'+(r?' Test before any code ships.':'')];
   if(q===0)return t?['Fake door','Enough visitors to count clicks on a feature that isn’t built yet.'+(r?' Tell people it’s coming soon so you keep their trust.':'')]:['Interviews, then concierge','Too few visitors to count. Talk to 5 to 8 people, then deliver it by hand.'];
   if(t)return r?['A/B test inside a staged rollout','Start at 5%, watch the guardrails, then widen.']:['A/B test','Split live traffic and compare the success metric.'];
   return r?['Staged rollout','Release to a small group first, with a way to switch it off.']:['Ship and compare','Not enough traffic for an A/B test. Watch the trend and pair it with user calls.'];
  };
  el.innerHTML=`<h2>${c.h}</h2>${G.map((g,gi)=>`<div class="group"><p class="rowlabel">${g[0]}</p><div class="pick">${g[1].map((o,oi)=>`<button data-g="${gi}" data-o="${oi}">${o}</button>`).join('')}</div></div>`).join('')}<div class="out" aria-live="polite"></div>`;
  const show=()=>{el.querySelectorAll('.pick button').forEach(b=>b.classList.toggle('on',v[+b.dataset.g]===+b.dataset.o));const a=ans();el.querySelector('.out').innerHTML=`<h3>${a[0]}</h3><p>${a[1]}</p>`};
  el.querySelectorAll('.pick button').forEach(b=>b.onclick=()=>{v[+b.dataset.g]=+b.dataset.o;show()});show();
 },
 build(c,el,st,m){
  const b=BUILD[m.id];
  el.innerHTML=`<h2>${b.h}</h2><p class="lead">Pick a product idea you care about and use it in all six modules. The grey words are just an example.</p>
   <div class="preview" aria-live="polite"></div><div class="form">${b.f.map(f=>{const id=m.id+f[0],val=S.v[id]||'';
    return `<label for="${id}">${f[1]}${Array.isArray(f[2])?`<select id="${id}"><option value="">Choose…</option>${f[2].map(o=>`<option${o===val?' selected':''}>${o}</option>`).join('')}</select>`:`<input id="${id}" value="${esc(val)}" placeholder="${esc(f[2])}" autocomplete="off">`}</label>`}).join('')}</div>`;
  const pv=el.querySelector('.preview'),show=()=>pv.innerHTML=fill(m.id);
  el.querySelectorAll('input,select').forEach(i=>i.oninput=()=>{S.v[i.id]=i.value;save();show()});show();
 }
};

/* first-touch cue per interactive card: [label, element it points at, elements that pulse] */
/* now=1: shown on arrival because the control doesn't look tappable. Others wait until Next is pressed without any interaction. */
const CUE={reveal:['Tap a tile to open it','.grid','.flip'],sort:['Tap where it belongs','.buckets','.bucket'],quiz:['Tap your answer','.opts','.opt'],
 journey:['Tap a step on the chart','.chart','.chart circle',1],funnel:['Tap a stage to inspect it','.frows','.frow',1],
 picker:['Tap one answer in each row','.group','.pick button:not(.on)'],build:['Type here and the sentence fills in','.form','.form input,.form select']};

/* ---------- player ---------- */
function play(m){
  let i=Math.min(S.pos[m.id]||0,m.cards.length-1);
  setCol(app,m.col);
  app.innerHTML=`<div class="nav"><a class="sq" href="#home" aria-label="All modules" style="text-decoration:none;color:inherit">←</a><div class="segs">${m.cards.map((_,k)=>`<button data-k="${k}" aria-label="Card ${k+1}"></button>`).join('')}</div></div>
   <section class="stage"></section><div class="ctrl"><button class="btn" id="prev">Back</button><button class="btn go" id="next"></button></div>`;
  const stage=app.querySelector('.stage'),next=app.querySelector('#next'),prev=app.querySelector('#prev');
  const show=()=>{
   const c=m.cards[i];S.pos[m.id]=i;S.seen[m.id]=[...new Set([...(S.seen[m.id]||[]),i])];save();
   stage.className='stage';stage.style.animation='none';void stage.offsetWidth;stage.style.animation='';
   stage.innerHTML='';R[c.t](c,stage,stage,m);
   stage.onpointerdown=stage.onkeydown=null;cueOff();
   const cue=CUE[c.t];pending=null;
   if(cue&&stage.querySelector(cue[1])){
    pending=()=>{pending=null;showCue(stage,cue)};
    stage.onpointerdown=e=>{if(e.target.closest('button,input,select,circle')){pending=null;cueOff()}};
    stage.onkeydown=e=>{if(e.key==='Enter'||e.key===' '||e.target.matches('input,select')){pending=null;cueOff()}};
    if(cue[3])pending();
   }
   app.querySelectorAll('.segs button').forEach((b,k)=>{b.className=k===i?'on':(S.seen[m.id].includes(k)?'seen':'')});
   prev.hidden=i===0;next.textContent=i===m.cards.length-1?'Finish '+m.name:'Next';
  };
  const go=d=>{
   if(d>0&&pending){pending();return}
   if(i+d>=m.cards.length){S.pos[m.id]=0;save();confetti();location.hash='home';return}
   i=Math.max(0,i+d);show();scrollTo(0,0);
  };
  next.onclick=()=>go(1);prev.onclick=()=>go(-1);
  app.querySelectorAll('.segs button').forEach(b=>b.onclick=()=>{i=+b.dataset.k;show()});
  keyNav=go;show();
}
let keyNav=null,pending=null,cueEl=null;
function cueOff(){if(cueEl){cueEl.remove();cueEl=null}}
function showCue(stage,cue){
  cueOff();
  const tgt=stage.querySelector(cue[1]);
  cueEl=document.createElement('div');cueEl.className='cue';cueEl.setAttribute('role','status');
  cueEl.innerHTML='<span aria-hidden="true">👇</span>'+cue[0];stage.append(cueEl);
  const place=()=>{if(!cueEl)return;cueEl.style.top=(tgt.offsetTop-8)+'px';cueEl.style.left=Math.max(12,tgt.offsetLeft+4)+'px'};
  place();addEventListener('resize',place,{once:true});
}
addEventListener('keydown',e=>{
  if(!keyNav||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==='ArrowRight')keyNav(1);if(e.key==='ArrowLeft')keyNav(-1);
});

   <div class="grid"><div class="blk k0"><h3>Open with the problem</h3><p>Maya before the product. No features yet.</p></div><div class="blk k1"><h3>One number per slide</h3><p>The metric, the target, the guardrail.</p></div><div class="blk k2"><h3>End with the ask</h3><p>What you need to run the first test.</p></div></div>
   <div class="ctrl"><button class="btn go" id="copy">Copy pitch as text</button></div><textarea class="copyout" id="copyout" hidden readonly aria-label="Pitch text"></textarea>`;

function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=document.createElement('canvas');cv.className='confetti';document.body.append(cv);
  const x=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const col=['#FFC533','#FF6A55','#2F6BFF','#1FCB8A','#7C4DF2','#FF6FB1','#19C3D6'];
  const P=Array.from({length:150},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.6,vx:(Math.random()-.5)*4,vy:3+Math.random()*5,s:7+Math.random()*9,c:col[Math.random()*col.length|0],r:Math.random()*6}));
  let t=0;(function f(){x.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.12;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++t<180)requestAnimationFrame(f);else cv.remove()})();
}
